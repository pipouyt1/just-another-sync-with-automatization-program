<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>editor de widgets</title>
<style>
:root{--bg:#fef7ff;--surf:#f3edf7;--surf-hi:#ece6f0;--on:#1d1b20;--on-var:#49454f;--outline:#79747e;--outline-var:#cac4d0;
 --pri:#6750a4;--on-pri:#fff;--pri-c:#eaddff;--on-pri-c:#21005d;--sec-c:#e8def8;--on-sec-c:#1d192b;--ter-c:#ffd8e4;--on-ter-c:#31111d;
 --err:#b3261e;--snack:#322f35;--on-snack:#f5eff7;--scrim:#1d1b2066;--stage:#2b2930}
@media(prefers-color-scheme:dark){:root{--bg:#141218;--surf:#211f26;--surf-hi:#2b2930;--on:#e6e0e9;--on-var:#cac4d0;--outline:#938f99;--outline-var:#49454f;
 --pri:#d0bcff;--on-pri:#381e72;--pri-c:#4f378b;--on-pri-c:#eaddff;--sec-c:#4a4458;--on-sec-c:#e8def8;--ter-c:#633b48;--on-ter-c:#ffd8e4;
 --err:#f2b8b5;--snack:#e6e0e9;--on-snack:#322f35;--scrim:#000a;--stage:#1d1b20}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;height:100vh;display:grid;grid-template-rows:auto 1fr;background:var(--bg);color:var(--on);font:15px/1.45 "Roboto Flex",Roboto,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}

/* ---- barra superior ---- */
#top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px}
#top select{width:auto;max-width:230px;background:var(--surf);border:0;border-radius:16px;padding:11px 16px}
.btn{background:var(--sec-c);color:var(--on-sec-c);border-radius:20px;padding:10px 20px;font-size:14px;font-weight:500}
.btn:hover{filter:brightness(.96)}
.btn.go{background:var(--pri);color:var(--on-pri)}
.btn.red{background:transparent;color:var(--err)}
#status{margin-left:auto;color:var(--on-var);font-size:13px}

/* ---- estructura ---- */
#main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:12px;min-height:0;padding:0 12px 12px}
#left{background:var(--surf);border-radius:28px;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.acc-head{padding:14px 18px;background:var(--surf-hi);border-radius:20px;cursor:pointer;user-select:none;margin-bottom:6px}
.acc-head.open{background:var(--pri-c);color:var(--on-pri-c)}
.acc-body{padding:8px 6px 12px}
#addwrap{margin-top:auto;position:relative}
#addmenu{background:var(--surf-hi);border-radius:20px;padding:6px;margin-bottom:8px;border:1px solid var(--outline-var)}
#addmenu div{cursor:pointer;padding:10px 14px;border-radius:14px}#addmenu div:hover{background:var(--sec-c)}
#addbtn{width:100%;background:var(--pri);color:var(--on-pri);border-radius:20px;padding:15px 20px;text-align:left;font-size:15px;font-weight:500;display:flex;align-items:center}
#addbtn::before{content:"+";font-size:26px;line-height:1;margin-right:12px}
#right{display:grid;grid-template-rows:1fr auto;gap:12px;min-height:0;min-width:0}
#stage{background:var(--stage);border-radius:28px;overflow:auto;display:grid;place-items:center;padding:32px}
#stage .holder{position:relative}
#props{background:var(--surf);border-radius:28px;padding:16px 22px;display:flex;flex-wrap:wrap;gap:14px 34px;align-items:center}
.pf{display:flex;align-items:center;gap:12px}
.pf label{max-width:130px;line-height:1.25;color:var(--on-var);font-size:13px;margin:0}

/* ---- controles ---- */
input[type=color]{width:46px;height:46px;padding:0;border:2px solid var(--outline);border-radius:50%;background:none;cursor:pointer;overflow:hidden}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
input[type=number],input[type=text],input[type=url],select,textarea{width:100%;padding:10px 14px;border-radius:16px;border:1.5px solid var(--outline);background:transparent;outline:0}
input[type=number]:focus,input[type=text]:focus,input[type=url]:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 .5px var(--pri)}
select option{background:var(--surf-hi);color:var(--on)}
input[type=range]{width:150px;accent-color:var(--pri)}
input[type=checkbox]{accent-color:var(--pri);width:18px;height:18px}
label{color:var(--on-var)}
.row{display:grid;grid-template-columns:90px 1fr;gap:6px 8px;align-items:center;margin:8px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:8px 0}
.row2 label,.row label{font-size:13px}
.hint{font-size:13px;color:var(--on-var);margin:6px 0}
.list>div{display:flex;align-items:center;gap:6px;padding:8px 12px;margin:6px 0;cursor:pointer;background:var(--surf-hi);border-radius:16px}
.list>div.sel{background:var(--pri-c);color:var(--on-pri-c)}
.list>div>span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{background:var(--sec-c);color:var(--on-sec-c);border-radius:10px;padding:0 8px;line-height:24px}
.tok{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;margin:5px 0;background:var(--surf-hi);border-radius:14px;cursor:pointer}
.tok b{font-weight:500}.tok i{opacity:.75;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}
.bad{color:var(--err)}
dialog{background:var(--surf-hi);color:var(--on);border:0;border-radius:28px;max-width:min(440px,92vw);padding:24px}
dialog::backdrop{background:var(--scrim)}
dialog h3{font-size:24px;font-weight:500;margin:0 0 12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--snack);color:var(--on-snack);padding:14px 20px;border-radius:14px;display:none;z-index:10;max-width:90vw;font-size:14px}
@media(max-width:820px){body{height:auto}#main{grid-template-columns:1fr}#stage{min-height:300px}}

/* todo el texto fijo del programa va en minúscula; lo que escribe el usuario (datos) se respeta */
body,button{text-transform:lowercase}
input,textarea,select,code,pre{text-transform:none}
.list>div>span,.tok{text-transform:none}
#stage,#stage *{text-transform:none}
html[data-lang=pi] body,html[data-lang=pi] button,html[data-lang=pi] .tb{text-transform:none}
</style></head><body>

<div id="top">
 <a href="/" class="btn" style="text-decoration:none">← portal</a>
 <select id="wsel" aria-label="widget"></select>
 <button class="btn" id="bNew">Nuevo widget</button>
 <button class="btn red" id="bDel">Eliminar</button>
 <button class="btn go" id="bSave">Guardar</button>
 <span id="status"></span>
</div>

<div id="main">
 <div id="left">
  <div id="accs"></div>
  <div id="addwrap">
   <div id="addmenu" hidden></div>
   <button id="addbtn">añadir objetos</button>
  </div>
 </div>
 <div id="right">
  <div id="stage"></div>
  <div id="props"></div>
 </div>
</div>

<dialog id="notice"><h3>Editas fuera de Windows</h3>
 <p>Los cambios que guardes aquí se aplican a los widgets de tus PCs aunque tú no los veas, y puede que cambien un widget sin que lo desees.</p>
 <p>Se recomienda editar desde Windows para verlo en tiempo real.</p>
 <div style="text-align:right;margin-top:18px"><button class="btn go" id="noticeOk">Entendido</button></div></dialog>
<div id="toast"></div>
<input type="file" id="pick" hidden>

<script src="/i18n.js"></script>
<script src="/widget.js"></script>
<script>
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);
 for(const[k,v]of Object.entries(attrs||{})){if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="class")e.className=v;else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v)}
 for(const c of kids.flat()){if(c===false||c==null)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",4000)};
const T=s=>HubI18n.tr(s);
const clone=o=>JSON.parse(JSON.stringify(o));
const clamp=(v,lo,hi,d)=>{v=parseInt(v);return isNaN(v)?d:Math.max(lo,Math.min(hi,v))};

/* ---------- sesion ---------- */
let token=null,ws,S=null;
const fromHash=location.hash.match(/token=([\w-]+)/);
try{if(fromHash){localStorage.setItem("token",fromHash[1]);history.replaceState(null,"",location.pathname)}token=localStorage.getItem("token")}catch{}
if(!token)location.href="/";

/* ---------- estado del editor ---------- */
let cur=null,draft=null,dname="",devs=[],dirty=false,sel=null,openTab="props",pendingNew=false,view=null,caret=0;
const TYPES={text:"texto",image:"imagen",document:"documento",camera:"cámara",website:"sitio web",shortcut:"acceso directo"};
const FONTS=["Segoe UI","Arial","Consolas","Georgia","Times New Roman","Comic Sans MS","Verdana","Impact","Courier New","Trebuchet MS"];
const UNIT={ram:"%",cpu:"%",uptime:" h",steam_hours:" h",steam_hours2w:" h",battery:"%",heart_rate:" lpm",sleep_hours:" h",distance_km:" km",calories:" kcal"};
function fmt(v){
 if(v.kind!="auto")return v.value||"";if(!v.online)return "sin conexión";if(v.value==null)return "—";
 if(v.metric=="apptime")return v.value>=60?Math.floor(v.value/60)+" h "+v.value%60+" min":v.value+" min";
 return v.value+(UNIT[v.metric]||"")}
function ctxVars(){
 const c={usuario:S?S.me.user:"",pc:"este navegador"};
 for(const v of S?S.variables:[])if(!v.mine){c[(v.name.trim()+"").toLowerCase()]??=fmt(v);c[(v.owner+"."+v.name).toLowerCase()]=fmt(v)}
 for(const v of S?S.variables:[])if(v.mine)c[v.name.trim().toLowerCase()]=fmt(v);
 return c}
const curWidget=()=>S&&S.widgets.find(w=>w.id===cur);
const obj=()=>draft&&draft.objects.find(o=>o.id===sel);

function connect(){
 ws=new WebSocket((location.protocol=="https:"?"wss://":"ws://")+location.host+"/ws");
 ws.onopen=()=>ws.send(JSON.stringify({type:"auth",token}));
 ws.onclose=()=>setTimeout(connect,3000);
 ws.onmessage=e=>onMsg(JSON.parse(e.data))}
const send=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));

function onMsg(m){
 if(m.type=="auth_error"){try{localStorage.removeItem("token")}catch{}location.href="/";return}
 if(m.type=="toast")toast(m.text);
 if(m.type=="kick"){try{localStorage.removeItem("token")}catch{}location.href="/";return}
 if(m.type=="locked"){toast("Cuenta bloqueada: desbloquéala en el portal (ajustes).");return}
 if(m.type=="widget_created"){cur=m.id;pendingNew=true;return}
 if(m.type=="values"&&S){
  for(const[id,v]of Object.entries(m.vars)){const x=S.variables.find(a=>a.id==id);if(x){x.value=v.value;x.online=v.online}}
  if(view)view.tick();if(openTab=="vars")renderAcc();return}
 if(m.type=="state"){
  S=m;
  if(!S.widgets.length){cur=null;draft=null}
  else if(!S.widgets.some(w=>w.id===cur)){const want=+new URLSearchParams(location.search).get("w");cur=(S.widgets.find(w=>w.id===want)||S.widgets[0]).id;loadWidget(cur)}
  else if(pendingNew||!dirty){pendingNew=false;loadWidget(cur,true)}
  fillSelect();renderAll()}}

function fillSelect(){
 const s=$("#wsel");s.replaceChildren(...S.widgets.map(w=>h("option",{value:w.id},w.name)));
 if(cur!=null)s.value=cur;if(!S.widgets.length)s.append(h("option",{},"(sin widgets)"))}

function loadWidget(id,keepSel){
 const w=S.widgets.find(x=>x.id===id);if(!w)return;
 cur=id;draft=clone(w.data);dname=w.name;devs=[...w.devices];setDirty(false);
 if(!keepSel||!draft.objects.some(o=>o.id===sel))sel=draft.objects.length?draft.objects[0].id:null}

function setDirty(d){dirty=d;$("#status").textContent=d?"Cambios sin guardar":(cur!=null?"Guardado ✓":"")}
function changed(full){setDirty(true);renderStage();if(full)renderAcc()}

function save(){
 if(cur==null)return;
 send({type:"widget_update",id:cur,name:dname,data:draft});
 send({type:"widget_devices",id:cur,devices:devs});
 setDirty(false);toast("Guardado. Los PCs marcados lo actualizan ahora.")}

/* ---------- vista previa ---------- */
function renderStage(){
 const st=$("#stage");
 if(!draft){st.replaceChildren(h("div",{style:"color:#ddd;text-align:center"},"Crea un widget con «Nuevo widget»"));view=null;return}
 const holder=h("div",{class:"holder"});st.replaceChildren(holder);
 view=HubWidget.render(holder,draft,{mode:"edit",ctx:ctxVars,assetBase:""});
 holder.querySelectorAll("[data-oid]").forEach(el=>{
  const id=el.dataset.oid;
  el.style.cursor="move";
  el.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();startDrag(e,id,"move")});
  if(id===sel){
   el.style.outline="2px solid #cfbcff";el.style.outlineOffset="-2px";
   const g=h("div",{style:"position:absolute;right:0;bottom:0;width:16px;height:16px;background:#cfbcff;cursor:nwse-resize"});
   g.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();startDrag(e,id,"resize")});
   el.append(g)}});
 view.box.addEventListener("pointerdown",()=>{if(sel){sel=null;renderStage();renderAcc()}})}

let drag=null;
function startDrag(e,id,mode){
 const o=draft.objects.find(x=>x.id===id);
 if(sel!==id){sel=id;openTab=openTab=="props"?"props":"obj";renderStage();renderAcc()}
 drag={id,mode,x:e.clientX,y:e.clientY,ox:o.x,oy:o.y,ow:o.w,oh:o.h,moved:false};
 addEventListener("pointermove",onDrag);addEventListener("pointerup",endDrag,{once:true})}
function onDrag(e){
 if(!drag)return;const o=draft.objects.find(x=>x.id===drag.id),dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(drag.mode=="move"){o.x=drag.ox+dx;o.y=drag.oy+dy}else{o.w=Math.max(10,drag.ow+dx);o.h=Math.max(10,drag.oh+dy)}
 drag.moved=true;
 const el=document.querySelector(`#stage [data-oid="${drag.id}"]`);
 if(el){el.style.left=o.x+"px";el.style.top=o.y+"px";el.style.width=o.w+"px";el.style.height=o.h+"px"}}
function endDrag(){
 removeEventListener("pointermove",onDrag);
 if(drag&&drag.moved){setDirty(true);renderAcc()}drag=null}

/* ---------- panel inferior: estilo del widget ---------- */
function renderProps(){
 const p=$("#props");if(!draft){p.replaceChildren();return}
 const color=(label,key)=>h("div",{class:"pf"},h("label",{},label),h("input",{type:"color",value:draft[key],oninput:e=>{draft[key]=e.target.value;changed()}}));
 const range=(label,key,lo,hi)=>{const out=h("span",{},draft[key]);
  return h("div",{class:"pf"},h("label",{},label),h("input",{type:"range",min:lo,max:hi,value:draft[key],oninput:e=>{draft[key]=+e.target.value;out.textContent=e.target.value;changed()}}),out)};
 p.replaceChildren(color("Color del widget","bg"),range("Transparencia del fondo (%)","opacity",0,100),
  color("Color del borde del widget","border"),range("Grosor del borde","borderw",0,12),
  range("Esquinas","radius",0,80),range("Sombra","shadow",0,40))}

/* ---------- panel izquierdo ---------- */
function renderAcc(){
 const box=$("#accs");if(!draft){box.replaceChildren();return}
 const o=obj();
 const tabs=[["props","Propiedades",propsTab],["vars","Variables usadas",varsTab],["obj",o?TYPES[o.type]:"Objeto",objTab]];
 box.replaceChildren(...tabs.map(([k,title,fn])=>{
  const open=openTab===k;
  return h("div",{},h("div",{class:"acc-head"+(open?" open":""),onclick:()=>{openTab=k;renderAcc()}},title),open&&h("div",{class:"acc-body"},fn()))}))}

const num=(o,k,lo,hi,cb)=>h("input",{type:"number",min:lo,max:hi,value:o[k],oninput:e=>{o[k]=clamp(e.target.value,lo,hi,o[k]);changed();cb&&cb()}});
const fieldRow=(label,input)=>h("div",{class:"row"},h("label",{},label),input);

function propsTab(){
 const list=h("div",{class:"list"},...draft.objects.map((o,i)=>h("div",{class:o.id===sel?"sel":"",onclick:()=>{sel=o.id;openTab="obj";renderStage();renderAcc()}},
  h("span",{},T(TYPES[o.type])+(o.type=="text"?" · "+(o.text||"").slice(0,18):o.type=="shortcut"?" · "+o.label:"")),
  h("button",{class:"mini",title:"subir",onclick:e=>{e.stopPropagation();move(i,-1)}},"▲"),
  h("button",{class:"mini",title:"bajar",onclick:e=>{e.stopPropagation();move(i,1)}},"▼"))));
 const devBox=h("div",{},...S.devices.filter(d=>d.mine).map(d=>h("label",{style:"display:flex;gap:8px;margin:4px 0;font-size:14px"},
  h("input",{type:"checkbox",checked:devs.includes(d.id),onchange:e=>{devs=e.target.checked?[...devs,d.id]:devs.filter(x=>x!=d.id);setDirty(true)}}),
  d.name+(d.online?"":T(" (desconectado)"))+(d.platform=="Windows"?"":" · "+d.platform))));
 return h("div",{},
  fieldRow("Nombre",h("input",{type:"text",value:dname,maxlength:40,oninput:e=>{dname=e.target.value;setDirty(true)}})),
  h("div",{class:"row2"},h("div",{},h("label",{},"Ancho"),num(draft,"w",80,1600)),h("div",{},h("label",{},"Alto"),num(draft,"h",40,1200))),
  h("label",{style:"display:flex;gap:8px;margin:8px 0"},h("input",{type:"checkbox",checked:draft.ontop,onchange:e=>{draft.ontop=e.target.checked;setDirty(true)}}),"Siempre encima de las ventanas"),
  h("p",{style:"margin:10px 0 2px;font-weight:600"},"Mostrar en estos PCs"),devBox,
  h("p",{class:"hint"},"Solo los PCs con el agente y Qt (PySide6) instalados muestran widgets."),
  h("p",{style:"margin:10px 0 2px;font-weight:600"},"Objetos (de abajo hacia arriba)"),list)}
function move(i,d){const a=draft.objects,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];changed(true)}

function tokensUsed(){
 const set=new Set();for(const o of draft.objects)if(o.type=="text")for(const m of o.text.matchAll(/\{([^{}]+)\}/g))set.add(m[1].trim());return[...set]}
function varsTab(){
 const ctx=Object.assign(HubWidget.builtins(),ctxVars()),used=tokensUsed();
 const avail=[...Object.keys(HubWidget.builtins()),"usuario","pc",...S.variables.filter(v=>v.mine).map(v=>v.name),...S.variables.filter(v=>!v.mine).map(v=>v.owner+"."+v.name)];
 const seen=new Set(),uniq=avail.filter(t=>!seen.has(t.toLowerCase())&&seen.add(t.toLowerCase()));
 return h("div",{},
  h("p",{style:"margin:2px 0;font-weight:600"},"Usadas en este widget"),
  used.length?used.map(t=>{const v=ctx[t.toLowerCase()];return h("div",{class:"tok",style:"cursor:default"},h("b",{class:v===undefined?"bad":""},"{"+t+"}"),h("i",{class:v===undefined?"bad":""},v===undefined?"no existe":v))}):h("p",{class:"hint"},"Ninguna todavía."),
  h("p",{style:"margin:12px 0 2px;font-weight:600"},"Disponibles (clic para insertar)"),
  uniq.map(t=>h("div",{class:"tok",onclick:()=>insertToken(t)},h("b",{},"{"+t+"}"),h("i",{},String(ctx[t.toLowerCase()]??"")))))}
function insertToken(t){
 const o=obj();if(!o||o.type!="text"){toast("Selecciona primero un objeto de texto.");return}
 const at=Math.min(caret,o.text.length);o.text=o.text.slice(0,at)+"{"+t+"}"+o.text.slice(at);caret=at+t.length+2;changed(true)}

async function upload(file){
 const r=await fetch("/api/asset",{method:"POST",headers:{Authorization:"Bearer "+token,"X-Filename":file.name},body:file});
 const d=await r.json();if(!r.ok)throw new Error(d.error||"No se pudo subir");return d}
function pickFile(accept,cb){
 const p=$("#pick");p.accept=accept;p.value="";
 p.onchange=async()=>{const f=p.files[0];if(!f)return;toast("Subiendo…");
  try{await cb(await upload(f));toast("Subido ✓")}catch(e){toast(e.message)}};p.click()}

/* Las cámaras las reporta el agente de cada PC (Qt las lista sin abrirlas). Se guarda el nombre elegido y el
   escritorio usa la cámara cuyo nombre lo contenga; si no la encuentra usa la predeterminada. */
function cameraPicker(o){
 const known=[];
 for(const d of S.devices.filter(d=>d.mine&&d.kind=="agent"))for(const c of d.cameras||[])known.push([c,d.name]);
 const opts=[["","predeterminada de windows"],...known.map(([c,pc])=>[c,c+"  ·  "+pc])];
 if(o.device&&!known.some(([c])=>c===o.device))opts.push([o.device,o.device+"  ·  (escrita a mano)"]);
 const sel=h("select",{onchange:e=>{o.device=e.target.value;changed(true)}},opts.map(([v,t])=>h("option",{value:v,selected:o.device===v},t)));
 const online=S.devices.some(d=>d.mine&&d.kind=="agent"&&d.online);
 return h("div",{},
  h("label",{style:"display:block;margin-top:8px"},"Cámara"),sel,
  h("div",{style:"display:flex;gap:8px;align-items:center;margin:6px 0"},
   h("button",{class:"btn",onclick:()=>{send({type:"cameras_refresh"});toast("Buscando cámaras en tus PCs…")}},"Buscar cámaras"),
   h("span",{class:"hint",style:"margin:0"},known.length?known.length+" encontrada(s)":(online?"Ninguna todavía":"Ningún PC con el agente conectado"))),
  h("label",{style:"display:block;margin-top:6px"},"O escribe parte del nombre"),
  h("input",{type:"text",maxlength:80,placeholder:"p. ej. obs virtual camera",value:o.device||"",onchange:e=>{o.device=e.target.value.trim();changed(true)}}),
  h("p",{class:"hint"},"La lista sale de los PCs con el agente y Qt (PySide6) instalados; no incluye todas las cámaras virtuales, por eso puedes escribir el nombre. Un PC sin esa cámara usa la predeterminada."))}

function objTab(){
 const o=obj();
 if(!o)return h("p",{class:"hint"},"Selecciona un objeto en la vista previa, o añade uno con «añadir objetos».");
 const geo=h("div",{class:"row2"},...[["x","X"],["y","Y"],["w","Ancho"],["h","Alto"]].map(([k,l])=>h("div",{},h("label",{},l),num(o,k,k=="x"||k=="y"?-2000:10,k=="x"||k=="y"?4000:2000))));
 const colorIn=(k)=>h("input",{type:"color",value:o[k],style:"width:100%;height:36px;border-width:3px",oninput:e=>{o[k]=e.target.value;changed()}});
 const sels=(k,opts)=>h("select",{onchange:e=>{o[k]=e.target.value;changed()}},opts.map(([v,t])=>h("option",{value:v,selected:o[k]===v},t)));
 const check=(k,label)=>h("label",{style:"display:flex;gap:8px;margin:6px 0"},h("input",{type:"checkbox",checked:!!o[k],onchange:e=>{o[k]=e.target.checked;changed()}}),label);
 let body;
 if(o.type=="text"){
  const ta=h("textarea",{rows:5,oninput:e=>{o.text=e.target.value;caret=e.target.selectionStart;changed()},onkeyup:e=>{caret=e.target.selectionStart},onblur:e=>{caret=e.target.selectionStart}});
  ta.value=o.text;
  body=h("div",{},h("label",{},"Texto (usa {variables})"),ta,
   h("div",{class:"row2"},h("div",{},h("label",{},"Letra"),sels("font",FONTS.map(f=>[f,f]))),h("div",{},h("label",{},"Tamaño"),num(o,"size",6,200))),
   h("div",{class:"row2"},h("div",{},h("label",{},"Color"),colorIn("color")),h("div",{style:"display:flex;gap:10px;align-items:end"},check("bold","Negrita"),check("italic","Cursiva"))),
   h("div",{class:"row2"},h("div",{},h("label",{},"Alinear"),sels("align",[["left","izquierda"],["center","centro"],["right","derecha"]])),h("div",{},h("label",{},"Vertical"),sels("valign",[["top","arriba"],["middle","medio"],["bottom","abajo"]]))))
 }else if(o.type=="image"){
  body=h("div",{},h("button",{class:"btn go",onclick:()=>pickFile("image/png,image/jpeg,image/gif,image/webp",d=>{o.src="asset:"+d.id;changed(true)})},"Subir imagen…"),
   h("div",{class:"row",style:"margin-top:8px"},h("label",{},"o enlace"),h("input",{type:"url",placeholder:"https://…",value:o.src.startsWith("asset:")?"":o.src,onchange:e=>{o.src=e.target.value.trim();changed()}})),
   h("div",{class:"row2"},h("div",{},h("label",{},"Ajuste"),sels("fit",[["cover","rellenar"],["contain","contener"],["fill","estirar"]])),h("div",{},h("label",{},"Esquinas"),num(o,"radius",0,200))))
 }else if(o.type=="document"){
  body=h("div",{},h("p",{},o.asset?"Archivo: "+(o.name||"subido"):"Aún sin archivo."),
   h("button",{class:"btn go",onclick:()=>pickFile(".pdf,.txt,.md,application/pdf,text/plain",d=>{o.asset=d.id;o.kind=d.kind=="pdf"?"pdf":"text";o.name=d.name;changed(true)})},"Subir PDF o texto…"),
   o.kind=="text"&&h("div",{class:"row2"},h("div",{},h("label",{},"Tamaño"),num(o,"size",6,80)),h("div",{},h("label",{},"Color"),colorIn("color"))),
   h("p",{class:"hint"},"Se desplaza con la rueda del mouse en el escritorio. Máx. 8 MB."))
 }else if(o.type=="camera"){
  body=h("div",{},check("mirror","Efecto espejo"),h("div",{},h("label",{},"Esquinas"),num(o,"radius",0,200)),
   cameraPicker(o),
   h("p",{class:"hint"},"Muestra la cámara del PC donde se ve el widget. El video nunca sale de ese PC. Windows pedirá permiso la primera vez."))
 }else if(o.type=="website"){
  body=h("div",{},h("label",{},"Dirección"),h("input",{type:"url",placeholder:"https://…",value:o.url,onchange:e=>{o.url=e.target.value.trim();changed(true)}}),
   h("div",{},h("label",{},"Esquinas"),num(o,"radius",0,200)),
   h("p",{class:"hint"},"En el escritorio se abre como una ventana web real que va sobre el resto de objetos. Aquí solo ves un marcador."))
 }else if(o.type=="shortcut"){
  body=h("div",{},h("label",{},"Texto del botón"),h("input",{type:"text",value:o.label,maxlength:60,oninput:e=>{o.label=e.target.value;changed()}}),
   h("label",{},"Qué abre"),h("input",{type:"text",placeholder:"https://…  o  c:\\programas\\app.exe",value:o.target,oninput:e=>{o.target=e.target.value;setDirty(true)}}),
   h("div",{class:"row2"},h("div",{},h("label",{},"Color del botón"),colorIn("bg")),h("div",{},h("label",{},"Color del texto"),colorIn("color"))),
   h("div",{class:"row2"},h("div",{},h("label",{},"Tamaño"),num(o,"size",6,80)),h("div",{},h("label",{},"Esquinas"),num(o,"radius",0,200))),
   h("p",{class:"hint"},"Al hacer clic abre la dirección, archivo o programa EN ESE PC. Solo funciona en el escritorio."))}
 return h("div",{},body,h("p",{style:"margin:12px 0 2px;font-weight:600"},"Posición y tamaño"),geo,
  h("div",{style:"display:flex;gap:8px;margin-top:8px"},
   h("button",{class:"btn",onclick:()=>{const c=clone(o);c.id=Math.random().toString(36).slice(2,8);c.x+=16;c.y+=16;draft.objects.push(c);sel=c.id;changed(true)}},"Duplicar"),
   h("button",{class:"btn red",onclick:()=>{draft.objects=draft.objects.filter(x=>x.id!==o.id);sel=draft.objects.length?draft.objects[draft.objects.length-1].id:null;changed(true)}},"Eliminar objeto")))}

/* ---------- añadir objetos ---------- */
const DEFAULTS={
 text:{w:240,h:60,text:"inserte texto",size:24,color:"#ffffff",bold:false,italic:false,align:"left",valign:"top",font:"Segoe UI"},
 image:{w:140,h:100,src:"",fit:"cover",radius:0},
 document:{w:220,h:140,asset:"",kind:"text",name:"",size:14,color:"#ffffff"},
 camera:{w:200,h:140,mirror:true,radius:8},
 website:{w:260,h:180,url:"",radius:8},
 shortcut:{w:140,h:44,label:"Abrir",target:"",bg:"#b5e61d",color:"#000000",size:16,radius:8}};
function addObject(type){
 if(!draft)return;
 const n=draft.objects.length,o={id:Math.random().toString(36).slice(2,8),type,x:20+n*14,y:20+n*14,...clone(DEFAULTS[type])};
 draft.objects.push(o);sel=o.id;openTab="obj";$("#addmenu").hidden=true;changed(true)}
function renderAddMenu(){
 $("#addmenu").replaceChildren(...Object.entries(TYPES).map(([t,l])=>h("div",{onclick:()=>addObject(t)},l)))}

function renderAll(){renderStage();renderProps();renderAcc()}

/* ---------- barra superior ---------- */
$("#wsel").onchange=e=>{
 if(dirty&&!confirm("tienes cambios sin guardar en este widget. ¿descartarlos?")){e.target.value=cur;return}
 loadWidget(+e.target.value);renderAll()};
$("#bNew").onclick=()=>send({type:"widget_create",name:"widget "+((S?S.widgets.length:0)+1)});
$("#bDel").onclick=()=>{if(cur!=null&&confirm("¿eliminar este widget de tu cuenta (en todos tus pcs)?")){send({type:"widget_delete",id:cur});cur=null}};
$("#bSave").onclick=save;
$("#addbtn").onclick=()=>{const m=$("#addmenu");m.hidden=!m.hidden};
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
renderAddMenu();connect();
if(!/Windows/.test(navigator.userAgent)){$("#notice").showModal();$("#noticeOk").onclick=()=>$("#notice").close()}
</script></body></html>
